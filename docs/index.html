<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DFB Typo-Pattern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Placeholder styling until the UI kit arrives: neutral tokens only.
   Layout: large preview left, one control column right (as the HUK tool); stacks on phones. */
:root {
  --bg: #ececec; --panel: #ffffff; --field: #f4f4f4; --ink: #111111; --muted: #6a6a6a; --line: #e0e0e0;
  --accent: #111111; --on-accent: #ffffff;
  --radius: 6px; --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121212; --panel: #1c1c1c; --field: #262626; --ink: #f2f2f2; --muted: #a0a0a0; --line: #303030;
  --accent: #f2f2f2; --on-accent: #121212; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121212; --panel: #1c1c1c; --field: #262626; --ink: #f2f2f2; --muted: #a0a0a0; --line: #303030;
  --accent: #f2f2f2; --on-accent: #121212; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--font); color: var(--ink); background: var(--bg);
  display: flex; flex-direction: column; gap: 12px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
[hidden] { display: none !important; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--panel); border-radius: var(--radius); padding: 8px 10px; position: relative; z-index: 4; }
.topbar h1 { font-size: 14px; margin: 0 8px 0 4px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; background: var(--field); border-radius: 4px; padding: 2px; }
.tabs [role=tab] { background: transparent; }
.tabs [role=tab][aria-selected=true] { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
#libCount:not(:empty) { font-size: 11px; color: var(--muted); }
.spacer { flex: 1; }
.group { display: flex; gap: 4px; align-items: center; position: relative; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
body[data-tab=library] .tool-only { display: none !important; }
.pair { width: 34px; height: 28px; padding: 0; justify-content: center; font: italic 900 13px var(--font); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.pair[aria-pressed=true] { outline: 2px solid var(--accent); outline-offset: 1px; }
.popover { position: absolute; top: calc(100% + 6px); right: 0; background: var(--panel); border-radius: var(--radius); box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 10px; min-width: 240px; display: flex; flex-direction: column; gap: 8px; z-index: 6; }
.menu-item { justify-content: flex-start; background: transparent; width: 100%; }
.menu-item[aria-pressed=true] { background: var(--field); font-weight: 600; }
.size-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
.popover label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); }

/* work area */
#tool { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; }
main { position: relative; min-width: 0; min-height: 0; background: var(--panel); border-radius: var(--radius); display: flex; flex-direction: column; }
#viewport { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 24px; }
#stage { position: relative; flex: none; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
#art, #art svg { width: 100%; height: 100%; display: block; }
.previewbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.previewbar .fs { display: flex; align-items: center; gap: 8px; }
.previewbar input[type=range] { width: 160px; accent-color: var(--accent); }
.previewbar input[type=number] { width: 70px; }
#zoomLabel { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
#status { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }

aside { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--panel); border-radius: var(--radius); }
.panel summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.panel summary::-webkit-details-marker { display: none; }
.panel summary::after { content: "+"; font-weight: 400; font-size: 18px; line-height: 1; color: var(--muted); }
.panel[open] summary::after { content: "–"; }
.panel-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: center; }
.row.wide { grid-template-columns: minmax(0, 1fr); }
.label { color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; }
textarea, select, input[type=number], input[type=text], input[type=search] { font: inherit; color: var(--ink); background: var(--field); border: 1px solid transparent; border-radius: 4px; padding: 6px 8px; min-width: 0; }
textarea { resize: vertical; width: 100%; }
.range { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.range input { width: 100%; accent-color: var(--accent); }
.range output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
button, .button { font: inherit; color: var(--ink); background: var(--field); border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
button:hover:not(:disabled) { filter: brightness(.95); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); color: var(--on-accent); }
button.icon { width: 30px; justify-content: center; padding: 6px 0; }
button.danger { color: #b3261e; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.segmented { display: flex; background: var(--field); border-radius: 4px; padding: 2px; flex-wrap: wrap; }
.segmented button { flex: 1; background: transparent; justify-content: center; padding: 5px 6px; }
.segmented button[aria-pressed=true] { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.segmented.small button { padding: 3px 8px; font-size: 12px; }

/* gradient editor */
.grad-editor { display: flex; flex-direction: column; gap: 8px; }
.grad-tools { display: flex; align-items: center; gap: 4px; }
.grad-stage { position: relative; width: 100%; border-radius: 4px; overflow: visible; }
.grad-canvas { display: block; width: 100%; height: 100%; border-radius: 4px; }
.grad-overlay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; touch-action: none; }
.grad-overlay:focus { outline: none; }
.grad-overlay .axis { stroke: #fff; stroke-width: 1.5; filter: drop-shadow(0 0 1px rgba(0,0,0,.6)); }
.grad-overlay .ring { fill: none; stroke: rgba(255,255,255,.75); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
.grad-overlay .handle { stroke-width: 2; cursor: grab; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
.grad-overlay .handle.start { fill: #fff; stroke: #3b82f6; }
.grad-overlay .handle.end { fill: #000; stroke: #fff; }
.grad-overlay .dot { fill: #fff; stroke: #000; stroke-width: 1.5; cursor: grab; }
.grad-overlay .resize { fill: #3b82f6; stroke: #fff; stroke-width: 1.5; cursor: ew-resize; }
.grad-overlay .pt.sel .ring { stroke: #3b82f6; stroke-dasharray: none; stroke-width: 1.5; }
.grad-overlay .del { cursor: pointer; }
.grad-overlay .del circle { fill: #fff; stroke: rgba(0,0,0,.25); }
.grad-overlay .del path { stroke: #000; stroke-width: 1.6; stroke-linecap: round; }
.stops { position: relative; padding-bottom: 16px; margin: 0 9px; }
.stops-bar { height: 22px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); cursor: copy; }
.stops-markers { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; }
.stop { position: absolute; top: 0; width: 16px; height: 18px; margin-left: -8px; padding: 0; border-radius: 3px; background: var(--swatch); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px rgba(0,0,0,.3); cursor: ew-resize; touch-action: none; }
.stop::before { content: ""; position: absolute; left: 4px; top: -5px; border: 4px solid transparent; border-bottom-color: rgba(0,0,0,.45); border-top: 0; }
.stop.sel { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px #3b82f6; }
.stop-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
.stop-row input { width: 100%; accent-color: var(--accent); }

/* library tab */
#library { flex: 1; min-height: 0; overflow-y: auto; background: var(--panel); border-radius: var(--radius); padding: 16px; }
.lib-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.lib-head h2 { margin: 0; font-size: 18px; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.lib-card { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lib-thumb { padding: 0; aspect-ratio: 16 / 9; width: 100%; overflow: hidden; background: var(--field); justify-content: center; }
.lib-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lib-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-name input { width: 100%; }
.lib-meta { color: var(--muted); font-size: 12px; min-height: 1em; }
.lib-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.lib-actions button { padding: 4px 8px; font-size: 12px; }
.lib-empty { color: var(--muted); }

#message { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--accent); color: var(--on-accent); padding: 10px 14px; border-radius: var(--radius); max-width: calc(100% - 32px); z-index: 8; }

@media (max-width: 820px) {
  html, body { height: auto; }
  #tool { grid-template-columns: minmax(0, 1fr); }
  main { height: 55vh; }
  .popover { right: auto; left: 0; }
}
</style>
</head>
<body>
<header class="topbar">
  <h1>DFB Typo-Pattern</h1>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="tool" aria-selected="true">Werkzeug</button>
    <button type="button" role="tab" data-tab="library" aria-selected="false">Bibliothek <span id="libCount"></span></button>
  </div>
  <span class="spacer"></span>
  <div class="group tool-only" id="colors" role="group" aria-label="Farbe"></div>
  <span class="sep tool-only"></span>
  <div class="group tool-only">
    <button type="button" id="formatBtn" data-popover="formatPop" aria-expanded="false" aria-haspopup="true">Format ▾</button>
    <div class="popover" id="formatPop" hidden>
      <div id="formatList"></div>
      <div class="size-row">
        <label>Breite<input type="number" id="fmtW" min="50" max="10000" step="1"></label>
        <span>×</span>
        <label>Höhe<input type="number" id="fmtH" min="50" max="10000" step="1"></label>
      </div>
    </div>
  </div>
  <span class="sep tool-only"></span>
  <div class="group tool-only">
    <button type="button" class="icon" id="undo" title="Rückgängig (⌘Z)" aria-label="Rückgängig">↶</button>
    <button type="button" class="icon" id="redo" title="Wiederholen (⇧⌘Z)" aria-label="Wiederholen">↷</button>
    <button type="button" id="reset" title="Hymne-Voreinstellung laden">Zurücksetzen</button>
  </div>
  <span class="sep tool-only"></span>
  <div class="group tool-only">
    <button type="button" id="saveBtn" data-popover="savePop" aria-expanded="false" aria-haspopup="true">Speichern</button>
    <form class="popover" id="savePop" hidden>
      <label>Name<input type="text" id="saveName" placeholder="z. B. Hymne weich" autocomplete="off"></label>
      <label>Von<input type="text" id="saveAuthor" placeholder="Dein Name (optional)" autocomplete="name"></label>
      <button type="submit" class="primary">In Bibliothek speichern</button>
    </form>
    <select id="exportMode" aria-label="SVG-Art">
      <option value="outlines">SVG · Pfade</option>
      <option value="both">SVG · Pfade + Text</option>
      <option value="text">SVG · nur Text</option>
    </select>
    <button type="button" id="download" class="primary">Herunterladen</button>
  </div>
</header>

<div id="tool">
  <main>
    <div id="viewport"><div id="stage"><div id="art"></div></div></div>
    <div class="previewbar">
      <span class="fs"><label for="fontSize">Schriftgröße</label><input type="range" id="fontSize" min="8" max="300" step="0.5"><input type="number" id="fontSizeNum" min="4" max="400" step="0.5" aria-label="Schriftgröße in px"></span>
      <span class="sep"></span>
      <button type="button" class="icon" id="zoomOut" aria-label="Verkleinern">−</button>
      <span id="zoomLabel">100 %</span>
      <button type="button" class="icon" id="zoomIn" aria-label="Vergrößern">+</button>
      <button type="button" id="zoomFit">Einpassen</button>
      <button type="button" id="zoom100">100 %</button>
      <span id="status"></span>
    </div>
  </main>
  <aside id="controls"></aside>
</div>

<section id="library" hidden></section>
<div id="message" hidden></div>
