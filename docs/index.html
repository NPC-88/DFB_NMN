<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DFB Typo-Pattern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Placeholder styling until the UI kit arrives: neutral tokens only.
   Layout: large preview left, one control column right (as the HUK tool); stacks on phones. */
:root {
  --bg: #ececec; --panel: #ffffff; --field: #f4f4f4; --ink: #111111; --muted: #6a6a6a; --line: #e0e0e0;
  --accent: #111111; --on-accent: #ffffff;
  --radius: 6px; --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121212; --panel: #1c1c1c; --field: #262626; --ink: #f2f2f2; --muted: #a0a0a0; --line: #303030;
  --accent: #f2f2f2; --on-accent: #121212; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121212; --panel: #1c1c1c; --field: #262626; --ink: #f2f2f2; --muted: #a0a0a0; --line: #303030;
  --accent: #f2f2f2; --on-accent: #121212; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--font); color: var(--ink); background: var(--bg);
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

main { position: relative; min-width: 0; min-height: 0; background: var(--panel); border-radius: var(--radius); display: flex; flex-direction: column; }
#viewport { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 24px; }
#stage { position: relative; flex: none; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
#stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
#art svg { width: 100%; height: 100%; display: block; }
#overlay { opacity: .5; mix-blend-mode: multiply; }
.toolbar { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; align-items: center; background: var(--panel); border-radius: var(--radius); padding: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.12); z-index: 2; }
#zoomLabel { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
#status { position: absolute; left: 16px; bottom: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }

aside { min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--panel); border-radius: var(--radius); padding: 14px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
header.card { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 15px; margin: 0; }
#gradient { display: block; width: 100%; border-radius: 4px; background: var(--field); touch-action: none; }
.grad-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.grad-foot label { display: flex; gap: 6px; align-items: center; }

#controls { display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--panel); border-radius: var(--radius); }
.panel summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.panel summary::-webkit-details-marker { display: none; }
.panel summary::after { content: "+"; font-weight: 400; font-size: 18px; line-height: 1; color: var(--muted); }
.panel[open] summary::after { content: "–"; }
.panel-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: center; }
.row.wide { grid-template-columns: minmax(0, 1fr); }
.row[hidden] { display: none; }
.label { color: var(--muted); }
.hint { margin: 0; color: var(--muted); font-size: 12px; }
textarea, select, input[type=number], input[type=text] { font: inherit; color: var(--ink); background: var(--field); border: 1px solid transparent; border-radius: 4px; padding: 6px 8px; min-width: 0; width: 100%; }
textarea { resize: vertical; }
.range { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.range input { width: 100%; accent-color: var(--accent); }
.range output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
button, .button { font: inherit; color: var(--ink); background: var(--field); border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .button:hover { filter: brightness(.96); }
button.primary { background: var(--accent); color: var(--on-accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.segmented { display: flex; background: var(--field); border-radius: 4px; padding: 2px; }
.segmented button { flex: 1; background: transparent; justify-content: center; padding: 5px 6px; }
.segmented button[aria-pressed=true] { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.pair { width: 100%; justify-content: flex-start; background: transparent; padding: 4px; }
.pair[aria-pressed=true] { background: var(--field); }
.pair-swatch { width: 44px; height: 28px; border-radius: 4px; display: grid; place-items: center; font: italic 900 15px var(--font); }
.lib-save { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.panel h3 { margin: 4px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.panel h3[hidden], .lib-list[hidden] { display: none; }
.lib-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.lib-list li { display: flex; gap: 4px; }
.lib-item { flex: 1; min-width: 0; justify-content: flex-start; background: transparent; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-item:hover { background: var(--field); }
.lib-del { background: transparent; color: var(--muted); }
.lib-list .empty { color: var(--muted); font-size: 12px; }
.lib-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.export { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
#message { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--accent); color: var(--on-accent); padding: 10px 14px; border-radius: var(--radius); max-width: calc(100% - 32px); z-index: 5; }

#fontgate { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 10; padding: 16px; }
#fontgate .card { max-width: 440px; display: flex; flex-direction: column; gap: 10px; }
#fontgate .drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 24px; text-align: center; color: var(--muted); }
#fontgate .drop.over { border-color: var(--accent); color: var(--ink); }

@media (max-width: 820px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 45vh auto; height: auto; min-height: 100%; }
  aside .scroll { overflow: visible; }
}
</style>
</head>
<body>
<main>
  <div class="toolbar" role="group" aria-label="Zoom">
    <button type="button" id="zoomOut" aria-label="Verkleinern">−</button>
    <span id="zoomLabel">100 %</span>
    <button type="button" id="zoomIn" aria-label="Vergrößern">+</button>
    <button type="button" id="zoomFit">Einpassen</button>
    <button type="button" id="zoom100">100 %</button>
  </div>
  <div id="viewport"><div id="stage"><div id="art"></div><canvas id="overlay" hidden></canvas></div></div>
  <span id="status"></span>
</main>
<aside>
  <header class="card"><h1>DFB Typo-Pattern</h1><button type="button" id="reset">Zurücksetzen</button></header>
  <div class="scroll">
    <section class="card" aria-label="Verlauf">
      <canvas id="gradient" width="240" height="135"></canvas>
      <div class="grad-foot"><span id="gradHint">dunkel = schwer</span><label><input type="checkbox" id="showField"> über dem Muster zeigen</label></div>
    </section>
    <div id="controls"></div>
  </div>
  <div class="card export">
    <select id="exportMode" aria-label="SVG-Art">
      <option value="outlines">SVG · Pfade</option>
      <option value="both">SVG · Pfade + Text (ausgeblendet)</option>
      <option value="text">SVG · nur Text</option>
    </select>
    <button type="button" id="download" class="primary">Herunterladen</button>
  </div>
</aside>
<div id="message" hidden></div>
