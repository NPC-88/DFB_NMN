<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DFB Typo-Pattern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Placeholder styling: neutral tokens only, to be replaced by the UI kit.
   Layout: control column left, live preview right; stacks on phones. */
:root {
  --bg: #f5f5f5; --panel: #ffffff; --field: #ffffff; --ink: #000000; --muted: #5e5e5e; --line: #d6d6d6;
  --accent: #262626; --on-accent: #ffffff; --check-a: #e6e6e6; --check-b: #ffffff;
  --radius: 0; --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161616; --panel: #1f1f1f; --field: #262626; --ink: #f5f5f5; --muted: #a8a8a8; --line: #3a3a3a;
  --accent: #f5f5f5; --on-accent: #161616; --check-a: #2a2a2a; --check-b: #1f1f1f; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #161616; --panel: #1f1f1f; --field: #262626; --ink: #f5f5f5; --muted: #a8a8a8; --line: #3a3a3a;
  --accent: #f5f5f5; --on-accent: #161616; --check-a: #2a2a2a; --check-b: #1f1f1f; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--font); color: var(--ink); background: var(--bg); display: grid; grid-template-columns: 340px minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
aside { background: var(--panel); border-inline: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 80px; min-height: 0; }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
h1 { font-size: 15px; margin: 0 0 10px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.group { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 10px 0 6px; min-width: 0; }
.group legend { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; padding: 0 4px 0 0; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: center; margin: 5px 0; }
.row[hidden] { display: none; }
.row:has(textarea) { grid-template-columns: 1fr; }
.label { color: var(--muted); }
textarea, select, input[type=number] { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); min-width: 0; }
textarea { width: 100%; resize: vertical; padding: 6px; }
select, input[type=number] { padding: 3px 4px; max-width: 100%; }
.range { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 6px; align-items: center; }
.range input[type=range] { width: 100%; accent-color: var(--accent); }
.segmented { display: flex; flex-wrap: wrap; }
button { font: inherit; color: var(--ink); border: 1px solid var(--line); background: var(--field); padding: 4px 8px; cursor: pointer; border-radius: var(--radius); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.segmented button + button { border-left: 0; }
.segmented button[aria-pressed=true], button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.swatches button { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); }
.swatches button[aria-pressed=true] { outline: 2px solid var(--accent); outline-offset: 1px; }
.swatches button.none { background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 8px 8px; }
.swatch-name { color: var(--muted); width: 100%; }
#viewport { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
#stage { position: relative; width: 100%; max-height: 100%; max-width: 100%; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
#stage.checker { background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 16px 16px !important; }
#stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
#art svg { width: 100%; height: 100%; display: block; }
#field { opacity: .55; mix-blend-mode: multiply; }
footer { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#status { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
#message { position: fixed; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); background: var(--accent); color: var(--on-accent); padding: 8px 12px; max-width: min(420px, calc(100% - 32px)); }
@media (max-width: 760px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 45%) minmax(0, 1fr); }
  aside { border-inline: 0; border-bottom: 1px solid var(--line); padding-inline: 0; }
  #viewport { padding: 12px 0; }
  footer { padding-inline: 0; }
}
</style>
</head>
<body>
<aside>
  <h1>DFB Typo-Pattern</h1>
  <div class="bar">
    <select id="preset" aria-label="Preset"></select>
    <button type="button" id="reset">Zurücksetzen</button>
  </div>
  <div id="controls"></div>
  <fieldset class="group">
    <legend>Farbe</legend>
    <div class="row"><span class="label">Musterfarbe</span><div id="color"></div></div>
    <div class="row"><span class="label">Vorschau-Hintergrund (nicht im Export)</span><div id="previewBg"></div></div>
    <div class="row"><span class="label">Welle anzeigen</span><input type="checkbox" id="showField"></div>
  </fieldset>
</aside>
<main>
  <div id="viewport"><div id="stage"><canvas id="field" hidden></canvas><div id="art"></div></div></div>
  <footer>
    <label>SVG <select id="exportMode">
      <option value="outlines">Pfade (skalierbar)</option>
      <option value="both">Pfade + editierbarer Text (ausgeblendet)</option>
      <option value="text">Nur editierbarer Text</option>
    </select></label>
    <span id="actions" class="bar" style="margin:0"></span>
    <span id="status"></span>
  </footer>
</main>
<div id="message" hidden></div>
<script>/*__APP__*/</script>
</body>
</html>
