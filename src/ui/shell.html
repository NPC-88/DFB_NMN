<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFB Typo-Pattern</title>
<style>
/* Placeholder styling: neutral tokens only, to be replaced by the UI kit. */
:root {
  --bg: #f5f5f5; --panel: #ffffff; --ink: #000000; --muted: #6b6b6b; --line: #dcdcdc;
  --accent: #262626; --radius: 0; --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--font); color: var(--ink); background: var(--bg); display: grid; grid-template-columns: 340px 1fr; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 80px; }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
h1 { font-size: 15px; margin: 0 0 10px; }
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.group { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 10px 0 6px; }
.group legend { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; padding: 0 4px 0 0; }
.row { display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: center; margin: 5px 0; }
.row[hidden] { display: none; }
.row:has(textarea) { grid-template-columns: 1fr; }
.label { color: var(--muted); }
textarea { width: 100%; font: inherit; resize: vertical; border: 1px solid var(--line); padding: 6px; }
select, input[type=number] { font: inherit; border: 1px solid var(--line); padding: 3px 4px; background: #fff; min-width: 0; }
.range { display: grid; grid-template-columns: 1fr 64px; gap: 6px; align-items: center; }
.range input[type=range] { width: 100%; accent-color: var(--accent); }
.segmented { display: flex; }
.segmented button, button { font: inherit; border: 1px solid var(--line); background: #fff; padding: 4px 8px; cursor: pointer; border-radius: var(--radius); }
.segmented button + button { border-left: 0; }
.segmented button[aria-pressed=true] { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.swatches button { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); }
.swatches button[aria-pressed=true] { outline: 2px solid var(--accent); outline-offset: 1px; }
.swatches button.none { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 8px 8px; }
.swatch-name { color: var(--muted); width: 100%; }
#viewport { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
#stage { position: relative; width: 100%; max-height: 100%; max-width: 100%; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
#stage.checker { background: repeating-conic-gradient(#e6e6e6 0 25%, #fff 0 50%) 0 0 / 16px 16px !important; }
#stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
#art svg { width: 100%; height: 100%; display: block; }
#field { image-rendering: auto; opacity: .55; mix-blend-mode: multiply; }
footer { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#status { color: var(--muted); margin-left: auto; }
#message { position: fixed; bottom: 56px; right: 16px; background: var(--accent); color: #fff; padding: 8px 12px; max-width: 420px; }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { max-height: 50vh; } }
</style>
</head>
<body>
<aside>
  <h1>DFB Typo-Pattern</h1>
  <div class="bar">
    <select id="preset" aria-label="Preset"></select>
    <button type="button" id="reset">Zurücksetzen</button>
  </div>
  <div id="controls"></div>
  <fieldset class="group">
    <legend>Farbe</legend>
    <div class="row"><span class="label">Musterfarbe</span><div id="color"></div></div>
    <div class="row"><span class="label">Vorschau-Hintergrund (nicht im Export)</span><div id="previewBg"></div></div>
    <div class="row"><span class="label">Welle anzeigen</span><input type="checkbox" id="showField"></div>
  </fieldset>
</aside>
<main>
  <div id="viewport"><div id="stage"><canvas id="field" hidden></canvas><div id="art"></div></div></div>
  <footer>
    <label>SVG <select id="exportMode">
      <option value="outlines">Pfade (skalierbar)</option>
      <option value="both">Pfade + editierbarer Text (ausgeblendet)</option>
      <option value="text">Nur editierbarer Text</option>
    </select></label>
    <span id="actions" class="bar" style="margin:0"></span>
    <span id="status"></span>
  </footer>
</main>
<div id="message" hidden></div>
<script>/*__APP__*/</script>
</body>
</html>
